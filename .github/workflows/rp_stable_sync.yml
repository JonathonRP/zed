name: RP upstream stable sync

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Propose a stable update or validate a generated sync branch
        type: choice
        options:
          - propose
          - validate
        default: propose
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    branches:
      - release/rp-stable
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: rp-upstream-stable-sync
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.repository == 'JonathonRP/zed' &&
      github.ref == 'refs/heads/automation/rp-control' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'propose'
        )
      )
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: release
    steps:
      - name: Checkout trusted RP control
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Checkout trusted RP release branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: release/rp-stable
          path: release
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Verify current base and discover official stable
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "JonathonRP/zed"
          current_tag="$(
            python3 -c 'import json; print(json.load(open(".github/rp-stable-base.json"))["upstream_tag"])'
          )"
          [[ "$current_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --no-tags https://github.com/zed-industries/zed.git \
            "refs/tags/${current_tag}:refs/tags/${current_tag}"
          python3 script/rp_stable_base.py verify

          gh api repos/zed-industries/zed/releases/latest > "$RUNNER_TEMP/latest.json"
          candidate_tag="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag_name"])' \
              "$RUNNER_TEMP/latest.json"
          )"
          [[ "$candidate_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --no-tags https://github.com/zed-industries/zed.git \
            "refs/tags/${candidate_tag}:refs/tags/${candidate_tag}"
          python3 script/rp_stable_base.py candidate \
            --release-json "$RUNNER_TEMP/latest.json" \
            --output "$RUNNER_TEMP/candidate-base.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Write discovery audit
        env:
          UPDATE: ${{ steps.stable.outputs.update }}
          OLD_TAG: ${{ steps.stable.outputs.old_tag }}
          OLD_SHA: ${{ steps.stable.outputs.old_sha }}
          OLD_VERSION: ${{ steps.stable.outputs.old_version }}
          NEW_TAG: ${{ steps.stable.outputs.new_tag }}
          NEW_SHA: ${{ steps.stable.outputs.new_sha }}
          NEW_VERSION: ${{ steps.stable.outputs.new_version }}
        run: |
          {
           echo "## Official stable discovery"
           echo
           echo "- Schedule: \`0 0 * * *\` (00:00 UTC daily)"
           echo "- Current: \`${OLD_TAG:-unchanged}\` / \`${OLD_SHA:-unchanged}\` / \`${OLD_VERSION:-unchanged}\`"
           echo "- Candidate: \`${NEW_TAG:-none}\` / \`${NEW_SHA:-none}\` / \`${NEW_VERSION:-none}\`"
           echo "- Update proposed: \`${UPDATE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebase RP patch series onto new stable
        if: steps.stable.outputs.update == 'true'
        id: rebase
        env:
          OLD_TAG: ${{ steps.stable.outputs.old_tag }}
          NEW_SHA: ${{ steps.stable.outputs.new_sha }}
          OLD_SHA: ${{ steps.stable.outputs.old_sha }}
          OLD_VERSION: ${{ steps.stable.outputs.old_version }}
          NEW_TAG: ${{ steps.stable.outputs.new_tag }}
          NEW_VERSION: ${{ steps.stable.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 "$GITHUB_WORKSPACE/control/script/rp_stable_sync.py" rebase \
            --repo . \
            --release-ref release/rp-stable \
            --old-tag "$OLD_TAG" \
            --old-sha "$OLD_SHA" \
            --old-version "$OLD_VERSION" \
            --new-tag "$NEW_TAG" \
            --new-sha "$NEW_SHA" \
            --new-version "$NEW_VERSION" \
            --report "$RUNNER_TEMP/rebase-conflict.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build proposed stable integration commit
        if: steps.rebase.outputs.outcome == 'rebased'
        env:
          NEW_TAG: ${{ steps.stable.outputs.new_tag }}
          RELEASE_TIP: ${{ steps.rebase.outputs.release_tip }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/candidate-base.json" .github/rp-stable-base.json
          git add .github/rp-stable-base.json
          git commit -m "ci: track upstream stable ${NEW_TAG} [skip ci]"
          rebased_tip="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          integration_commit="$(
            printf 'Prepare reviewed RP stable sync to %s\n' "$NEW_TAG" |
              git commit-tree "$tree" -p "$RELEASE_TIP" -p "$rebased_tip"
          )"
          git reset --hard "$integration_commit"

      - name: Push deterministic sync branch
        if: steps.rebase.outputs.outcome == 'rebased'
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.stable.outputs.new_version }}
        run: |
          set -euo pipefail
          branch="automation/rp-stable-v${NEW_VERSION}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          release_tip="$(git rev-parse HEAD^1)"
          live_release_tip="$(
            git ls-remote "$remote" refs/heads/release/rp-stable | cut -f1
          )"
          test "$live_release_tip" = "$release_tip"
          expected="$(git ls-remote "$remote" "refs/heads/${branch}" | cut -f1)"
          git branch -f "$branch" HEAD
          git push "$remote" "$branch:$branch" \
            "--force-with-lease=refs/heads/${branch}:${expected}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create or update review PR
        if: steps.rebase.outputs.outcome == 'rebased'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.push.outputs.branch }}
          OLD_TAG: ${{ steps.stable.outputs.old_tag }}
          OLD_SHA: ${{ steps.stable.outputs.old_sha }}
          OLD_VERSION: ${{ steps.stable.outputs.old_version }}
          NEW_TAG: ${{ steps.stable.outputs.new_tag }}
          NEW_SHA: ${{ steps.stable.outputs.new_sha }}
          NEW_VERSION: ${{ steps.stable.outputs.new_version }}
        run: |
          set -euo pipefail
          title="Track official Zed stable ${NEW_TAG}"
          body="$RUNNER_TEMP/pr-body.md"
          cat > "$body" <<EOF
          Updates the reviewed RP release line to the latest official, non-draft,
          non-prerelease Zed release.

          | | Previous | Proposed |
          |---|---|---|
          | Tag | \`${OLD_TAG}\` | \`${NEW_TAG}\` |
          | Commit | \`${OLD_SHA}\` | \`${NEW_SHA}\` |
          | Zed version | \`${OLD_VERSION}\` | \`${NEW_VERSION}\` |

          The RP-only series was recreated with \`git rebase --rebase-merges\`.
          This PR must pass focused provenance, release metadata, updater, and
          compatibility tests and be merged normally. It is never auto-merged
          and this workflow never publishes a release.
          EOF
          pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base release/rp-stable \
              --head "$BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base release/rp-stable \
              --head "$BRANCH" \
              --title "$title" \
              --body-file "$body"
          fi

      - name: Surface manual stable port
        if: steps.rebase.outputs.outcome == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.stable.outputs.new_tag }}
          NEW_VERSION: ${{ steps.stable.outputs.new_version }}
          RELEASE_TIP: ${{ steps.rebase.outputs.release_tip }}
          FAILED_COMMIT: ${{ steps.rebase.outputs.failed_commit }}
          CONFLICTED_PATH_COUNT: ${{ steps.rebase.outputs.conflicted_path_count }}
        run: |
          set -euo pipefail
          branch="automation/rp-stable-v${NEW_VERSION}-manual-port"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title="Manual RP stable port required for ${NEW_TAG}"
          body="$RUNNER_TEMP/manual-port-pr.md"
          python3 "$GITHUB_WORKSPACE/control/script/rp_stable_sync.py" render \
            --report "$RUNNER_TEMP/rebase-conflict.json" \
            --run-url "$run_url" \
            --output "$body"

          live_release_tip="$(
            git ls-remote "$remote" refs/heads/release/rp-stable | cut -f1
          )"
          test "$live_release_tip" = "$RELEASE_TIP"

          pr_json="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base release/rp-stable \
              --head "$branch" \
              --state all \
              --json number,state,mergedAt,url \
              --jq '.[0] // empty'
          )"
          if [[ -n "$pr_json" ]]; then
            pr="$(jq -r '.number' <<<"$pr_json")"
            state="$(jq -r '.state' <<<"$pr_json")"
            merged_at="$(jq -r '.mergedAt // empty' <<<"$pr_json")"
            pr_url="$(jq -r '.url' <<<"$pr_json")"
            if [[ -n "$merged_at" ]]; then
              echo "Manual-port PR ${pr_url} is already merged, but the release base is unchanged." >&2
              exit 1
            fi
            if [[ "$state" = "CLOSED" ]]; then
              gh pr reopen "$pr" --repo "$GITHUB_REPOSITORY"
            fi
          else
            remote_tip="$(
              git ls-remote "$remote" "refs/heads/${branch}" | cut -f1
            )"
            if [[ -z "$remote_tip" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              cp "$RUNNER_TEMP/rebase-conflict.json" \
                .github/rp-stable-port-request.json
              git add .github/rp-stable-port-request.json
              git commit -m "ci: request manual RP stable port to ${NEW_TAG} [skip ci]"
              git push "$remote" "HEAD:refs/heads/${branch}"
            fi
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base release/rp-stable \
                --head "$branch" \
                --draft \
                --title "$title" \
                --body-file "$body"
            )"
          fi

          echo "::warning title=Manual RP stable port required::${NEW_TAG} conflicts at ${FAILED_COMMIT}; use ${pr_url}"
          {
            echo
            echo "## Manual port required"
            echo
            echo "- First failing commit: \`${FAILED_COMMIT}\`"
            echo "- Conflicted paths: \`${CONFLICTED_PATH_COUNT}\`"
            echo "- Draft handoff: ${pr_url}"
            echo "- Scheduled run result: successful handoff; no release branch was changed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch read-only compatibility validation
        if: steps.rebase.outputs.outcome == 'rebased'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run rp_stable_sync.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH" \
            -f operation=validate

  validate:
    if: >-
      github.repository == 'JonathonRP/zed' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'validate'
        )
      )
    name: Validate RP stable compatibility
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout proposed stable sync
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: false

      - name: Verify provenance and compatibility
        run: |
          set -euo pipefail
          if [[ -e .github/rp-stable-port-request.json ]]; then
            echo "::error title=Manual RP stable port required::Replace the generated port request with a reviewed port before validation."
            exit 1
          fi
          tag="$(
            python3 -c 'import json; print(json.load(open(".github/rp-stable-base.json"))["upstream_tag"])'
          )"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --no-tags https://github.com/zed-industries/zed.git \
            "refs/tags/${tag}:refs/tags/${tag}"
          python3 script/rp_stable_base.py verify --previous-ref HEAD^1
          python3 -m unittest discover -s script -p 'test_rp*.py'
          cargo test -p release_channel
          cargo test -p auto_update rp_
