name: RP fork stable release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full RP stable merge SHA to rebuild
        required: true
        type: string
      validated_pr_head_sha:
        description: Full PR head SHA that passed compatibility validation
        required: true
        type: string
      publish_release:
        description: Publish the completed packages as a GitHub Release
        type: boolean
        default: false
  push:
    branches:
      - release/rp-stable

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  authorize:
    name: Authorize RP stable source
    if: >-
      github.repository == 'JonathonRP/zed' &&
      github.ref == 'refs/heads/release/rp-stable'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      control_sha: ${{ steps.authorize.outputs.control_sha }}
      release_sha: ${{ steps.authorize.outputs.release_sha }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      pull_number: ${{ steps.authorize.outputs.pull_number }}
      ordinary_run_id: ${{ steps.authorize.outputs.ordinary_run_id }}
      ordinary_job_id: ${{ steps.authorize.outputs.ordinary_job_id }}
    steps:
      - name: Checkout trusted release controls
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          path: control
          filter: blob:none
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Verify release authorization
        id: authorize
        shell: bash
        env:
          DISPATCH_RELEASE_SHA: ${{ inputs.release_sha }}
          DISPATCH_VALIDATED_HEAD_SHA: ${{ inputs.validated_pr_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$GITHUB_SHA"
          arguments=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_sha="$DISPATCH_RELEASE_SHA"
            arguments+=(
              --validated-head-sha "$DISPATCH_VALIDATED_HEAD_SHA"
              --require-attestation
            )
          fi
          python3 "$GITHUB_WORKSPACE/control/script/rp_release_authorization.py" \
            --control-root "$GITHUB_WORKSPACE/control" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --control-sha "$GITHUB_SHA" \
            --release-sha "$release_sha" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            "${arguments[@]}"

  metadata:
    name: Allocate RP release metadata
    needs: authorize
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'JonathonRP/zed' &&
      github.ref == 'refs/heads/release/rp-stable'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.allocate.outputs.version }}
      tag: ${{ steps.allocate.outputs.tag }}
      reused: ${{ steps.allocate.outputs.reused }}
    steps:
      - name: Checkout authorized product history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch all RP release tags
        run: git fetch --force --tags origin

      - name: Verify pinned upstream stable base
        env:
          RP_RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RP_RELEASE_SHA"
          tag="$(python3 -c 'import json; print(json.load(open(".github/rp-stable-base.json"))["upstream_tag"])')"
          git fetch --no-tags https://github.com/zed-industries/zed.git \
            "refs/tags/${tag}:refs/tags/${tag}"
          python3 script/rp_stable_base.py verify --previous-ref HEAD^1

      - name: Allocate calendar version and curate notes
        id: allocate
        run: |
          python3 script/rp_release_metadata.py \
            --output-dir target/rp-release-metadata \
            --github-output "$GITHUB_OUTPUT"
          python3 -m json.tool \
            target/rp-release-metadata/rp-release-manifest.json \
            >/dev/null

      - name: Upload RP release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp-release-metadata-${{ steps.allocate.outputs.version }}
          path: target/rp-release-metadata/*
          if-no-files-found: error
          retention-days: 30

  package_windows:
    name: Package unsigned Windows stable
    needs:
      - authorize
      - metadata
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'JonathonRP/zed' &&
      github.ref == 'refs/heads/release/rp-stable'
    runs-on: ${{ vars.ZED_WINDOWS_RUNNER || 'windows-2022' }}
    timeout-minutes: 360
    steps:
      - name: Checkout authorized product source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download RP release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rp-release-metadata-${{ needs.metadata.outputs.version }}
          path: target/rp-release-metadata

      - name: Cache Cargo sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          disable_annotations: true

      - name: Pin sccache wrapper path
        shell: pwsh
        run: |
          $sccachePath = "$env:SCCACHE_PATH.exe"
          if (-not (Test-Path -LiteralPath $sccachePath -PathType Leaf)) {
            throw "sccache action did not provide a valid SCCACHE_PATH"
          }
          @(
            "SCCACHE_PATH=$sccachePath"
            "RUSTC_WRAPPER=$sccachePath"
            "CARGO_BUILD_RUSTC_WRAPPER=$sccachePath"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Select stable channel
        shell: pwsh
        run: '"stable" | Set-Content -NoNewline crates/zed/RELEASE_CHANNEL'

      - name: Build unsigned installer and portable bundle
        shell: pwsh
        env:
          RP_RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          RP_VERSION: ${{ needs.metadata.outputs.version }}
          ZED_REQUIRE_SCCACHE: "1"
          ZED_CLIENT_CHECKSUM_SEED: fork-unsigned-stable
        run: |
          if ((git rev-parse HEAD) -ne $env:RP_RELEASE_SHA) {
            throw "Windows checkout does not match release commit"
          }
          $stableTag = (
            Get-Content -Raw ".github/rp-stable-base.json" |
              ConvertFrom-Json
          ).upstream_tag
          git fetch --no-tags https://github.com/zed-industries/zed.git `
            "refs/tags/${stableTag}:refs/tags/${stableTag}"
          python script/rp_stable_base.py verify

          script/test-bundle-windows-identity.ps1

          $metadataPath = "target/rp-release-metadata/rp-release-manifest.json"
          $metadata = Get-Content -Raw $metadataPath | ConvertFrom-Json
          if ($metadata.commit -ne $env:RP_RELEASE_SHA) {
            throw "RP metadata does not match the authorized release commit"
          }
          if ($metadata.calendar_version -ne $env:RP_VERSION) {
            throw "RP metadata version does not match the workflow allocation"
          }
          $env:ZED_RP_RELEASE_VERSION = $metadata.calendar_version
          $env:ZED_RP_RELEASE_TAG = $metadata.tag
          $env:ZED_RP_UPSTREAM_TAG = $metadata.upstream_tag
          $env:ZED_RP_UPSTREAM_TAG_COMMIT = $metadata.upstream_tag_commit
          $env:ZED_RP_RELEASE_NOTES = Get-Content -Raw "target/rp-release-metadata/release-notes.md"
          $env:ZED_RP_RELEASE_NOTES_IDENTITY = $metadata.notes_identity
          $env:ZED_RP_RELEASE_MANIFEST = Get-Content -Raw $metadataPath
          Copy-Item $metadataPath target/windows-source-identity.json

          $bundleStopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            script/bundle-windows.ps1 -Architecture x86_64
          } finally {
            $bundleStopwatch.Stop()
            Write-Host "RP Windows bundle elapsed: $($bundleStopwatch.Elapsed)"
          }
          Compress-Archive `
            -Path inno/x86_64/* `
            -DestinationPath target/zed-windows-x86_64-portable.zip `
            -CompressionLevel Optimal `
            -Force

          $version = $metadata.calendar_version
          Move-Item -Force `
            target/Zed-x86_64.exe `
            "target/Zed-rp-stable-$version-windows-x86_64.exe"
          Move-Item -Force `
            target/zed-windows-x86_64-portable.zip `
            "target/zed-rp-stable-$version-windows-x86_64-portable.zip"
          Move-Item -Force `
            target/zed-remote-server-windows-x86_64.zip `
            "target/zed-rp-stable-$version-remote-server-windows-x86_64.zip"

      - name: Show sccache statistics
        if: always()
        shell: pwsh
        run: |
          try {
            & $env:SCCACHE_PATH --show-stats
          } finally {
            & $env:SCCACHE_PATH --stop-server
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp-package-windows-x86_64-${{ needs.metadata.outputs.version }}
          path: |
            target/Zed-rp-stable-${{ needs.metadata.outputs.version }}-windows-x86_64.exe
            target/zed-rp-stable-${{ needs.metadata.outputs.version }}-windows-x86_64-portable.zip
            target/zed-rp-stable-${{ needs.metadata.outputs.version }}-remote-server-windows-x86_64.zip
            target/windows-source-identity.json
          if-no-files-found: error
          retention-days: 30

  package_linux_remote_server:
    name: Package Linux musl remote server
    needs:
      - authorize
      - metadata
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'JonathonRP/zed' &&
      github.ref == 'refs/heads/release/rp-stable'
    runs-on: ${{ vars.ZED_LINUX_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 180
    steps:
      - name: Checkout authorized product source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download RP release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rp-release-metadata-${{ needs.metadata.outputs.version }}
          path: target/rp-release-metadata

      - name: Cache Cargo sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad

      - name: Pin sccache wrapper path
        run: |
          test -x "$SCCACHE_PATH"
          printf 'RUSTC_WRAPPER=%s\n' "$SCCACHE_PATH" >> "$GITHUB_ENV"

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build remote server
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          RELEASE_CHANNEL: stable
          RP_RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          RP_VERSION: ${{ needs.metadata.outputs.version }}
          RUSTFLAGS: -C target-feature=+crt-static
          ZED_RELEASE_CHANNEL: stable
        run: |
          test "$(git rev-parse HEAD)" = "$RP_RELEASE_SHA"
          tag="$(python3 -c 'import json; print(json.load(open(".github/rp-stable-base.json"))["upstream_tag"])')"
          git fetch --no-tags https://github.com/zed-industries/zed.git \
            "refs/tags/${tag}:refs/tags/${tag}"
          python3 script/rp_stable_base.py verify --previous-ref HEAD^1
          manifest_sha="$(
            python3 -c 'import json; print(json.load(open("target/rp-release-metadata/rp-release-manifest.json"))["commit"])'
          )"
          test "$manifest_sha" = "$RP_RELEASE_SHA"
          cp target/rp-release-metadata/rp-release-manifest.json \
            target/linux-source-identity.json

          printf stable > crates/zed/RELEASE_CHANNEL
          export RELEASE_VERSION="$(script/get-crate-version zed)"
          build_start=$SECONDS
          cargo --config .cargo/bundle-config.toml build \
            --release \
            --package remote_server \
            --target x86_64-unknown-linux-musl
          echo "RP Linux remote server build elapsed: $((SECONDS - build_start))s"
          gzip_start=$SECONDS
          gzip --best --stdout \
            target/x86_64-unknown-linux-musl/release/remote_server \
            > "target/zed-rp-stable-${RP_VERSION}-remote-server-linux-x86_64.gz"
          echo "RP Linux remote server gzip elapsed: $((SECONDS - gzip_start))s"

      - name: Show sccache statistics
        if: always()
        run: "${SCCACHE_PATH} --show-stats"

      - name: Upload Linux remote server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp-package-linux-x86_64-${{ needs.metadata.outputs.version }}
          path: |
            target/zed-rp-stable-${{ needs.metadata.outputs.version }}-remote-server-linux-x86_64.gz
            target/linux-source-identity.json
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble release assets
    needs:
      - authorize
      - metadata
      - package_windows
      - package_linux_remote_server
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'JonathonRP/zed' &&
      github.ref == 'refs/heads/release/rp-stable'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout authorized manifest tooling
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rp-package-*-${{ needs.metadata.outputs.version }}
          path: dist
          merge-multiple: true

      - name: Download RP release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rp-release-metadata-${{ needs.metadata.outputs.version }}
          path: metadata

      - name: Finalize release manifests
        env:
          RP_RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          RP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RP_RELEASE_SHA"
          cmp dist/windows-source-identity.json dist/linux-source-identity.json
          cmp dist/windows-source-identity.json metadata/rp-release-manifest.json
          rm dist/windows-source-identity.json dist/linux-source-identity.json
          version="${RP_VERSION}"
          cp metadata/rp-release-manifest.json \
            "dist/rp-release-manifest-${version}.json"
          cp metadata/release-notes.md \
            "dist/RP-Fork-Release-Notes-${version}.md"
          python3 script/rp_release_metadata.py \
            --finalize-manifest metadata/rp-release-manifest.json \
            --dist dist \
            --repository "$GITHUB_REPOSITORY" \
            --output-file dist/rp-update.json
          (
            cd dist
            sha256sum * > SHA256SUMS
          )

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fork-stable-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs:
      - authorize
      - metadata
      - assemble
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'JonathonRP/zed' &&
      github.ref == 'refs/heads/release/rp-stable' &&
      inputs.publish_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout release history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fork-stable-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Download RP release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rp-release-metadata-${{ needs.metadata.outputs.version }}
          path: metadata

      - name: Create or verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RP_RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          RP_TAG: ${{ needs.metadata.outputs.tag }}
          RP_VERSION: ${{ needs.metadata.outputs.version }}
          RP_REUSED: ${{ needs.metadata.outputs.reused }}
        run: |
          upstream_version="$(python3 -c 'import json; print(json.load(open("metadata/rp-release-manifest.json"))["upstream_version"])')"
          upstream_tag="$(python3 -c 'import json; print(json.load(open("metadata/rp-release-manifest.json"))["upstream_tag"])')"
          title="RP ${RP_VERSION} (Zed ${upstream_version} stable; ${upstream_tag})"
          if gh release view "$RP_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RP_TAG}:refs/tags/${RP_TAG}"
            tag_sha="$(git rev-list -n 1 "refs/tags/${RP_TAG}")"
            if [[ "$tag_sha" != "$RP_RELEASE_SHA" ]]; then
              echo "::error::Published RP tag ${RP_TAG} points to ${tag_sha}, not ${RP_RELEASE_SHA}"
              exit 1
            fi
            mkdir published-dist
            gh release download "$RP_TAG" \
              --dir published-dist \
              --repo "$GITHUB_REPOSITORY"
            python3 script/rp_release_metadata.py \
              --verify-published-assets dist \
              --published-assets published-dist
            echo "Published RP release ${RP_TAG} is byte-identical; leaving it unchanged."
          elif [[ "$RP_REUSED" == "true" ]]; then
            git fetch --force origin "refs/tags/${RP_TAG}:refs/tags/${RP_TAG}"
            test "$(git rev-list -n 1 "refs/tags/${RP_TAG}")" = "$RP_RELEASE_SHA"
            gh release create "$RP_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --notes-file metadata/release-notes.md
          else
            gh release create "$RP_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RP_RELEASE_SHA" \
              --title "$title" \
              --notes-file metadata/release-notes.md
          fi
