name: RP 1.27 supplemental hosted tests
on:
  push:
    branches:
      - validation/rp-127-e27-hosted-tests-20261110
permissions:
  contents: read
env:
  EXPECTED_SOURCE: e27be8d21bbc2c756732280d1730e69039c7fdb3
  EXPECTED_TREE: 7ccb4f7c9236f41cae28c35df4f8b3abf7185a7d
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  focused-tests:
    name: Pinned real ACP adapter initialization (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout immutable product candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: JonathonRP/zed
          ref: e27be8d21bbc2c756732280d1730e69039c7fdb3
          fetch-depth: 1
          persist-credentials: false
      - name: Record and guard actual tested source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:EXPECTED_SOURCE) {
            throw 'Test checkout is not the immutable candidate.'
          }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -cne $env:EXPECTED_TREE) {
            throw 'Test checkout tree mismatch.'
          }
          New-Item -ItemType Directory -Path hosted-test-evidence | Out-Null
          [ordered]@{
            source = $source
            tree = $tree
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            workflow_definition_commit = $env:GITHUB_SHA
            supplemental_tests_only = $true
            release_authorization = $false
          } | ConvertTo-Json |
            Set-Content hosted-test-evidence/source.json -Encoding utf8NoBOM
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Required repository Rust toolchain is unavailable.' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Cargo is unavailable.' }
      - name: Install missing documented Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! pkg-config --exists alsa fontconfig glib-2.0 openssl libva wayland-client xkbcommon xkbcommon-x11 libzstd sqlite3 \
            || ! command -v clang >/dev/null \
            || ! command -v cmake >/dev/null \
            || ! command -v ld.lld >/dev/null; then
            script/linux
          fi
          df -h .
          free -h
      - name: Select supported Linux C++ compiler and linker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v clang-18
          command -v clang++-18
          command -v ld.lld
          clang++-18 --version
          printf '%s\n' 'CC=clang-18' 'CXX=clang++-18' \
            'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang-18' \
            'RUSTFLAGS=-C symbol-mangling-version=v0 --cfg tokio_unstable -C link-arg=-fuse-ld=lld' \
            >> "$GITHUB_ENV"
      - name: Cache Cargo sources only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up required Node runtime for pinned adapter
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Build only the existing ACP smoke test executable
        shell: bash
        run: |
          set -euo pipefail
          cargo test -j 1 -p agent_servers --lib --locked --no-run --message-format=json \
            > hosted-test-evidence/compiler-artifacts.jsonl \
            2> >(tee hosted-test-evidence/compile.log >&2)
          python3 - <<'PY'
          import json, pathlib
          messages = [json.loads(line) for line in pathlib.Path("hosted-test-evidence/compiler-artifacts.jsonl").read_text().splitlines()]
          binaries = [m["executable"] for m in messages if m.get("reason") == "compiler-artifact" and m.get("target", {}).get("name") == "agent_servers" and m.get("profile", {}).get("test") and m.get("executable")]
          if len(binaries) != 1:
              raise RuntimeError(f"Expected one ACP test executable, found {binaries!r}")
          pathlib.Path("hosted-test-evidence/test-executable.txt").write_text(binaries[0] + "\n")
          PY
      - name: Prewarm exact anonymous adapter package outside handshake timeouts
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$RUNNER_TEMP/rp-adapter-smoke-home"
          isolated_tmp="$RUNNER_TEMP/rp-adapter-smoke-tmp"
          mkdir "$isolated_home" "$isolated_tmp"
          timeout --signal=TERM --kill-after=15s 300s env -i \
            HOME="$isolated_home" TMPDIR="$isolated_tmp" PATH="$PATH" \
            npx --yes @agentclientprotocol/claude-agent-acp@0.94.0 --version \
            2>&1 | tee hosted-test-evidence/pinned-adapter-version.log
          grep -Fx '0.94.0' hosted-test-evidence/pinned-adapter-version.log
      - name: Run exact pinned adapter smoke without inherited credentials
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$RUNNER_TEMP/rp-adapter-smoke-home"
          isolated_tmp="$RUNNER_TEMP/rp-adapter-smoke-tmp"
          test -d "$isolated_home"
          test -d "$isolated_tmp"
          binary="$(cat hosted-test-evidence/test-executable.txt)"
          test -x "$binary"
          timeout --signal=TERM --kill-after=15s 180s env -i \
            HOME="$isolated_home" TMPDIR="$isolated_tmp" PATH="$PATH" \
            ZED_HEADLESS=1 ZED_DISABLE_STAFF=1 SEED=0 ITERATIONS=1 \
            "$binary" acp::selection_tests::claude_adapter_initialize_smoke \
            --ignored --exact --nocapture --test-threads=1 \
            2>&1 | tee hosted-test-evidence/real-adapter-smoke.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored' \
            hosted-test-evidence/real-adapter-smoke.log
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Preserve source-bound test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp-127-real-adapter-smoke-e27be8d21bbc2c756732280d1730e69039c7fdb3
          path: hosted-test-evidence/
          if-no-files-found: error
          retention-days: 7
