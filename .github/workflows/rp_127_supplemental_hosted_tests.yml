name: RP 1.27 generated persistent profile upgrade
on:
  push:
    branches:
      - validation/rp-127-e27-hosted-tests-20261110
permissions:
  contents: read
  actions: read
env:
  EXPECTED_SOURCE: 2d339cac9a9ffa47e1621aab8602b1870b95c5d1
jobs:
  windows-prebuilt:
    name: Delivered Windows synthetic GUI render and edit
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download exact canonical Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: JonathonRP/zed
          run-id: 42910418431
          github-token: ${{ github.token }}
          name: rp-profile-compatibility-windows-x86_64-2d339cac9a9ffa47e1621aab8602b1870b95c5d1
          path: canonical-windows
      - name: Download exact canonical metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: JonathonRP/zed
          run-id: 42910418431
          github-token: ${{ github.token }}
          name: rp-profile-compatibility-metadata-2d339cac9a9ffa47e1621aab8602b1870b95c5d1
          path: canonical-metadata
      - name: Run bounded delivered-binary metadata diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path runtime-evidence | Out-Null
          $manifest = Get-Content canonical-metadata/rp-release-manifest.json -Raw | ConvertFrom-Json
          $packaged = Get-Content canonical-windows/windows-source-identity.json -Raw | ConvertFrom-Json
          if ($manifest.commit -cne $env:EXPECTED_SOURCE -or $packaged.commit -cne $env:EXPECTED_SOURCE) {
            throw 'Delivered artifact source mismatch.'
          }
          $portable = Join-Path (Resolve-Path canonical-windows) $manifest.asset_names.windows_x86_64_portable
          if ((Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              'c2a227c50b4364525ef0b2c40c477188f5bf59bc130af84abf4b8c512e102253') {
            throw 'Portable archive digest mismatch.'
          }
          $product = Join-Path $env:RUNNER_TEMP 'rp127-delivered-portable'
          Expand-Archive -LiteralPath $portable -DestinationPath $product
          $exe = Join-Path $product 'Zed.exe'
          $digest = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne '41edefb6ad42dbde200ab600c13a7d22f84923f9d7076890b5673b48a35542fa') {
            throw 'Delivered RP executable digest mismatch.'
          }
          $metadata = (Resolve-Path canonical-metadata).Path
          $process = Start-Process -FilePath $exe -ArgumentList @(
            '--verify-rp-release-metadata', ('"' + $metadata + '"')
          ) -PassThru -RedirectStandardOutput runtime-evidence/metadata.stdout.log `
            -RedirectStandardError runtime-evidence/metadata.stderr.log
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id
            throw 'Delivered metadata diagnostic exceeded its 60-second bound.'
          }
          if ($process.ExitCode -ne 0) { throw "Delivered metadata diagnostic exited $($process.ExitCode)." }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          if (-not $version.StartsWith('1.27.0+stable.') -or -not $version.EndsWith($env:EXPECTED_SOURCE)) {
            throw "Delivered product version does not bind source: $version"
          }
          [ordered]@{
            source = $env:EXPECTED_SOURCE
            run_id = $env:GITHUB_RUN_ID
            workflow_definition_commit = $env:GITHUB_SHA
            canonical_run = 42910418431
            rp_executable_sha256 = $digest
            product_version = $version
            metadata_diagnostic_exit_code = $process.ExitCode
            gui_runtime_tested = $false
            private_profile_tested = $false
            wsl_runtime_tested = $false
            owner_acceptance = $false
          } | ConvertTo-Json | Set-Content runtime-evidence/source.json -Encoding utf8NoBOM
      - name: Verify public baseline release without private profile input
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api repos/JonathonRP/zed/releases/tags/rp-stable-20261106.1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.id -ne 439358160 -or $release.draft) {
            throw 'Unexpected immutable public baseline release.'
          }
          $download = Join-Path $env:RUNNER_TEMP 'rp127-public-baseline-download'
          New-Item -ItemType Directory -Path $download | Out-Null
          $assets = @(
            @{ id = 728116944; name = 'rp-release-manifest-20261106.1.json'; sha = '19cdc6f70f133786b64ec8257580d0491d2ec56528a141e33e591977cd93c265' },
            @{ id = 728116943; name = 'RP-Fork-Release-Notes-20261106.1.md'; sha = '3fce9b5bf9af753582827ed0ec599913e3a806be5991626f264410a2300a8ec9' },
            @{ id = 728117082; name = 'zed-rp-stable-20261106.1-windows-x86_64-portable.zip'; sha = 'f3f46b338cfaff260f68a0d1e53c019dbefb33f44debe83963c1470f34c1ca9a' }
          )
          foreach ($expected in $assets) {
            $actual = @($release.assets | Where-Object id -eq $expected.id)
            if ($actual.Count -ne 1 -or $actual[0].name -cne $expected.name -or
                $actual[0].digest -cne "sha256:$($expected.sha)") { throw 'Baseline public asset identity changed.' }
            gh release download rp-stable-20261106.1 --repo JonathonRP/zed --pattern $expected.name --dir $download
            if ($LASTEXITCODE -ne 0) { throw 'Public baseline download failed.' }
            if ((Get-FileHash (Join-Path $download $expected.name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected.sha) {
              throw 'Public baseline downloaded bytes do not match the immutable digest.'
            }
          }
          $env:GH_TOKEN = $null
          $manifest = Get-Content (Join-Path $download $assets[0].name) -Raw | ConvertFrom-Json
          if ($manifest.commit -cne '12ddb317483dae00f4c413c343e0a6f1ad263a77' -or
              $manifest.upstream_version -cne '1.26.2' -or
              $manifest.upstream_tag_commit -cne 'c4273271092b0287f7d181f616bd5171e0a2f70c') {
            throw 'Baseline source/upstream identity mismatch.'
          }
          $metadata = Join-Path $env:RUNNER_TEMP 'rp127-public-baseline-metadata'
          New-Item -ItemType Directory -Path $metadata | Out-Null
          Copy-Item (Join-Path $download $assets[0].name) (Join-Path $metadata 'rp-release-manifest.json')
          Copy-Item (Join-Path $download $assets[1].name) (Join-Path $metadata 'release-notes.md')
          $product = Join-Path $env:RUNNER_TEMP 'rp127-public-baseline-portable'
          Expand-Archive (Join-Path $download $assets[2].name) -DestinationPath $product
          $exe = Join-Path $product 'Zed.exe'
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          if (-not $version.StartsWith('1.26.2+stable.') -or -not $version.EndsWith($manifest.commit)) {
            throw 'Baseline executable version does not bind its public source.'
          }
          $process = Start-Process $exe -ArgumentList @('--verify-rp-release-metadata', ('"' + $metadata + '"')) `
            -PassThru -RedirectStandardOutput runtime-evidence/baseline-metadata.stdout.log `
            -RedirectStandardError runtime-evidence/baseline-metadata.stderr.log
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id
            throw 'Public baseline metadata verification timed out.'
          }
          if ($process.ExitCode -ne 0) { throw 'Public baseline embedded metadata verification failed.' }
          @{
            source = $manifest.commit; version = $version; metadata_exit_code = $process.ExitCode
            executable_sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            release_id = $release.id; assets = $assets; private_profile = $false
          } | ConvertTo-Json -Depth 5 | Set-Content runtime-evidence/baseline-proof.json -Encoding utf8NoBOM
      - name: Upgrade a copied generated persistent profile and reopen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class RpGui {
              [StructLayout(LayoutKind.Sequential)]
              public struct Flags { public int Inherit, Reserved; public uint Value; }
              [StructLayout(LayoutKind.Sequential)]
              public struct Rect { public int Left, Top, Right, Bottom; }
              [StructLayout(LayoutKind.Sequential)]
              public struct Point { public int X, Y; }
              [DllImport("user32.dll")] public static extern IntPtr GetProcessWindowStation();
              [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern bool GetUserObjectInformation(IntPtr handle, int index, ref Flags flags, uint size, out uint needed);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hwnd);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
              [DllImport("user32.dll", SetLastError = true)] public static extern bool GetWindowRect(IntPtr hwnd, out Rect rect);
              [DllImport("user32.dll", SetLastError = true)] public static extern bool PrintWindow(IntPtr hwnd, IntPtr hdc, uint flags);
              [DllImport("user32.dll", SetLastError = true)] public static extern bool ClientToScreen(IntPtr hwnd, ref Point point);
              [DllImport("user32.dll", SetLastError = true)]
              public static extern bool SetWindowPos(IntPtr hwnd, IntPtr after, int x, int y, int width, int height, uint flags);
              [DllImport("user32.dll", SetLastError = true)]
              public static extern bool PostMessage(IntPtr hwnd, uint message, UIntPtr wparam, IntPtr lparam);
          }
          '@
          $exe = Join-Path $env:RUNNER_TEMP 'rp127-delivered-portable\Zed.exe'
          $candidateExe = $exe
          $baselineExe = Join-Path $env:RUNNER_TEMP 'rp127-public-baseline-portable\Zed.exe'
          $profile = Join-Path $env:RUNNER_TEMP 'rp127-synthetic-profile'
          $workspace = Join-Path $env:RUNNER_TEMP 'rp127-synthetic-workspace'
          $evidence = (Resolve-Path runtime-evidence).Path
          $gui = [ordered]@{
            source = $env:EXPECTED_SOURCE; canonical_run = 42910418431; run_id = $env:GITHUB_RUN_ID
            profile_kind = 'Fresh synthetic hosted data only, not a copied private profile'
            stateless = $false; presentation = 'HWND swapchain, D3D11 still required; no force-WARP flag'
            owner_acceptance = $false; wsl_runtime_tested = $false
            visible_window_station = $false; passes = @(); process_exits = @(); catalog_snapshots = @(); status = 'not_started'
          }
          $script:process = $null
          $script:stdout = $null
          $script:stderr = $null
          $script:pass = 0
          function Read-Log {
            $path = Join-Path $profile 'logs\Zed.log'
            if (-not (Test-Path -LiteralPath $path)) { return '' }
            $stream = [IO.File]::Open($path, 'Open', 'Read', 'ReadWrite')
            try {
              $reader = [IO.StreamReader]::new($stream)
              try { return $reader.ReadToEnd() } finally { $reader.Dispose() }
            } finally { $stream.Dispose() }
          }
          function Owned-Window {
            $script:process.Refresh()
            if ($script:process.HasExited) { throw 'Owned GUI process exited before completing the smoke.' }
            $actual = Get-CimInstance Win32_Process -Filter "ProcessId = $($script:process.Id)"
            if ($actual.ExecutablePath -ine $exe -or -not $actual.CommandLine.Contains($profile)) {
              throw 'Owned GUI executable/profile identity mismatch.'
            }
            $window = $script:process.MainWindowHandle
            [uint32]$owner = 0
            [void][RpGui]::GetWindowThreadProcessId($window, [ref]$owner)
            if ($window -eq [IntPtr]::Zero -or $owner -ne $script:process.Id -or
                -not [RpGui]::IsWindowVisible($window)) { throw 'An owned visible GUI window is required.' }
            return $window
          }
          function Key([uint32]$Code, [int64]$Scan) {
            $window = Owned-Window
            if (-not [RpGui]::PostMessage($window, 0x100, [UIntPtr]$Code, [IntPtr](($Scan -shl 16) -bor 1L)) -or
                -not [RpGui]::PostMessage($window, 0x101, [UIntPtr]$Code, [IntPtr](($Scan -shl 16) -bor 0xC0000001L))) {
              throw 'Unable to queue a key only to the owned GUI window.'
            }
          }
          function Capture([string]$Name) {
            $window = Owned-Window
            $rect = [RpGui+Rect]::new()
            if (-not [RpGui]::GetWindowRect($window, [ref]$rect)) { throw 'Owned window dimensions unavailable.' }
            $width = $rect.Right - $rect.Left; $height = $rect.Bottom - $rect.Top
            if ($width -lt 100 -or $height -lt 100) { throw 'Owned GUI capture is too small.' }
            $image = [Drawing.Bitmap]::new($width, $height)
            $graphics = [Drawing.Graphics]::FromImage($image)
            try {
              $hdc = $graphics.GetHdc()
              try {
                if (-not [RpGui]::PrintWindow($window, $hdc, 2)) { throw 'Owned window capture failed.' }
              } finally { $graphics.ReleaseHdc($hdc) }
              $colors = [Collections.Generic.HashSet[int]]::new()
              for ($y = 0; $y -lt $height; $y += 8) {
                for ($x = 0; $x -lt $width; $x += 8) { [void]$colors.Add($image.GetPixel($x, $y).ToArgb()) }
              }
              $image.Save((Join-Path $evidence $Name), [Drawing.Imaging.ImageFormat]::Png)
              if ($colors.Count -lt 16) { throw 'Owned capture lacks rendered color variation.' }
            } finally { $graphics.Dispose(); $image.Dispose() }
          }
          function Trust-SyntheticFixture {
            $window = Owned-Window
            $rect = [RpGui+Rect]::new()
            $origin = [RpGui+Point]::new()
            if (-not [RpGui]::GetWindowRect($window, [ref]$rect) -or
                -not [RpGui]::ClientToScreen($window, [ref]$origin)) { throw 'Owned click coordinates unavailable.' }
            # Position measured from the actual synthetic-only trust-dialog capture.
            $x = [int](($rect.Right - $rect.Left) * 0.714) + $rect.Left - $origin.X
            $y = [int](($rect.Bottom - $rect.Top) * 0.468) + $rect.Top - $origin.Y
            if ($x -lt 0 -or $y -lt 0 -or $x -ge $rect.Right - $rect.Left -or $y -ge $rect.Bottom - $rect.Top) {
              throw 'Synthetic trust click would be outside the owned window.'
            }
            $position = [IntPtr](($y -shl 16) -bor $x)
            foreach ($event in @(@{ message = 0x200; buttons = 0 }, @{ message = 0x201; buttons = 1 }, @{ message = 0x202; buttons = 0 })) {
              if (-not [RpGui]::PostMessage($window, $event.message, [UIntPtr]$event.buttons, $position)) {
                throw 'Unable to click only the owned synthetic project trust dialog.'
              }
            }
          }
          function Close-Owned {
            if ($null -eq $script:process) { return }
            if (-not $script:process.HasExited) {
              if (-not $script:process.CloseMainWindow() -or -not $script:process.WaitForExit(15000)) {
                Stop-Process -Id $script:process.Id
                [void]$script:process.WaitForExit(5000)
                throw 'Owned synthetic GUI failed to close gracefully within 15 seconds.'
              }
            }
            if (-not $script:stdout.Wait(5000) -or -not $script:stderr.Wait(5000)) { throw 'Owned GUI output did not close.' }
            [IO.File]::WriteAllText((Join-Path $evidence "gui-$script:pass.stdout.log"), $script:stdout.Result)
            [IO.File]::WriteAllText((Join-Path $evidence "gui-$script:pass.stderr.log"), $script:stderr.Result)
            $exitCode = $script:process.ExitCode
            $gui.process_exits += @{ pass = $script:pass; source = $phaseSource; exit_code = $exitCode }
            $script:process.Dispose(); $script:process = $null
            if ($exitCode -ne 0) { throw "Owned profile process exited $exitCode." }
          }
          try {
            $flags = [RpGui+Flags]::new(); [uint32]$needed = 0
            if (-not [RpGui]::GetUserObjectInformation([RpGui]::GetProcessWindowStation(), 1, [ref]$flags, 12, [ref]$needed)) {
              throw 'Unable to inspect hosted window station.'
            }
            $gui.visible_window_station = ($flags.Value -band 1) -ne 0
            if (-not $gui.visible_window_station) {
              throw 'Hosted runner has no interactive visible window station; GUI not launched, no GUI pass claimed.'
            }
            New-Item -ItemType Directory -Path "$profile\config", $workspace | Out-Null
            @{
              auto_update = $false; disable_ai = $true; restore_on_startup = 'none'
              telemetry = @{ diagnostics = $false; metrics = $false }
              context_servers = @{}; agent_servers = @{}
              feature_flags = @{ 'acp-beta' = 'on'; 'rp-hosted-upgrade-control' = 'off' }
            } | ConvertTo-Json -Depth 4 | Set-Content "$profile\config\settings.json" -Encoding utf8NoBOM
            '[{"bindings":{"f7":["pane::ActivateItem",0],"f8":"editor::MoveToEnd","f9":"workspace::Save"}}]' |
              Set-Content "$profile\config\keymap.json" -Encoding utf8NoBOM
            $fixture = Join-Path $workspace 'hosted-fixture.txt'
            [IO.File]::WriteAllText($fixture, 'Hosted RP 1.27 fixture.')
            $expectedText = "Hosted RP 1.27 fixture. Saved by hosted UI.`r`n"
            for ($script:pass = 1; $script:pass -le 3; $script:pass++) {
              if ($script:pass -eq 1) {
                $exe = $baselineExe
                $phaseSource = '12ddb317483dae00f4c413c343e0a6f1ad263a77'
              } else {
                $exe = $candidateExe
                $phaseSource = $env:EXPECTED_SOURCE
              }
              if ($script:pass -eq 2) {
                $copy = Join-Path $env:RUNNER_TEMP 'rp127-generated-profile-copy'
                $dbFiles = @(Get-ChildItem -LiteralPath (Join-Path $profile 'db') -Recurse -File)
                if ($dbFiles.Count -eq 0) { throw 'Baseline did not generate persistent database files.' }
                $inventory = @($dbFiles | ForEach-Object {
                  @{
                    relative_path = [IO.Path]::GetRelativePath($profile, $_.FullName)
                    bytes = $_.Length
                    sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  }
                })
                Copy-Item -LiteralPath $profile -Destination $copy -Recurse
                foreach ($entry in $inventory) {
                  $copied = Join-Path $copy $entry.relative_path
                  if ((Get-FileHash $copied -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.sha256) {
                    throw 'Generated database copy is not byte-identical before candidate startup.'
                  }
                }
                @{
                  baseline_source = '12ddb317483dae00f4c413c343e0a6f1ad263a77'
                  candidate_source = $env:EXPECTED_SOURCE
                  baseline_process_closed_before_copy = $true
                  private_profile = $false; databases = $inventory
                } | ConvertTo-Json -Depth 5 | Set-Content runtime-evidence/database-copy-proof.json -Encoding utf8NoBOM
                $profile = $copy
              }
              $before = Read-Log
              $start = [Diagnostics.ProcessStartInfo]::new($exe)
              $start.UseShellExecute = $false; $start.WorkingDirectory = $workspace
              $start.RedirectStandardOutput = $true; $start.RedirectStandardError = $true
              $start.Environment.Clear()
              foreach ($name in @('SystemRoot','SystemDrive','WINDIR','TEMP','TMP','PATH','USERPROFILE',
                  'LOCALAPPDATA','APPDATA','ProgramData','ProgramFiles','ProgramFiles(x86)','USERNAME','USERDOMAIN',
                  'COMSPEC','PATHEXT','PSModulePath','HOMEDRIVE','HOMEPATH','PUBLIC','NUMBER_OF_PROCESSORS')) {
                $value = [Environment]::GetEnvironmentVariable($name)
                if ($value) { $start.Environment[$name] = $value }
              }
              $start.Environment['ZED_DISABLE_STAFF'] = '1'
              $start.Environment['ZED_ALLOW_EMULATED_GPU'] = '1'
              $start.Environment['GPUI_DISABLE_DIRECT_COMPOSITION'] = '1'
              $start.Environment['ZED_UPDATE_EXPLANATION'] = 'Synthetic hosted smoke: updater disabled'
              $start.Environment['RUST_LOG'] = 'info'
              foreach ($argument in @('--foreground', '--user-data-dir', $profile, $fixture)) {
                $start.ArgumentList.Add($argument)
              }
              $script:process = [Diagnostics.Process]::Start($start)
              $script:stdout = $script:process.StandardOutput.ReadToEndAsync()
              $script:stderr = $script:process.StandardError.ReadToEndAsync()
              $deadline = [DateTime]::UtcNow.AddSeconds(50)
              do {
                $script:process.Refresh()
                if ($script:process.HasExited) { throw 'Hosted GUI process exited before rendering.' }
                $log = Read-Log
                $newLog = if ($log.Length -ge $before.Length) { $log.Substring($before.Length) } else { $log }
                if ($newLog -match 'starting headless|failed to initialize DirectX|panicked at') {
                  throw "Hosted GUI did not initialize a renderer: $newLog"
                }
                if ($newLog.Contains('Rendered first frame') -and $script:process.MainWindowHandle -ne [IntPtr]::Zero) { break }
                Start-Sleep -Milliseconds 250
              } while ([DateTime]::UtcNow -lt $deadline)
              if (-not $newLog.Contains('Rendered first frame')) { throw 'No genuine rendered frame before the 50-second deadline.' }
              $window = Owned-Window
              if (-not [RpGui]::SetWindowPos($window, [IntPtr]::Zero, 0, 0, 1280, 900, 0x0014)) {
                throw 'Unable to size only the owned GUI window.'
              }
              Start-Sleep -Milliseconds 500
              Capture "gui-$script:pass-rendered.png"
              Trust-SyntheticFixture
              Start-Sleep -Milliseconds 500
              Key 0x76 0x41
              Start-Sleep -Milliseconds 500
              Capture "gui-$script:pass-fixture.png"
              if ($script:pass -eq 2) {
                Key 0x77 0x42
                Start-Sleep -Milliseconds 200
                foreach ($character in ' Saved by hosted UI.'.ToCharArray()) {
                  if (-not [RpGui]::PostMessage($window, 0x102, [UIntPtr][uint32]$character, [IntPtr]1)) {
                    throw 'Unable to queue synthetic text to the owned GUI window.'
                  }
                }
                Key 0x78 0x43
                $deadline = [DateTime]::UtcNow.AddSeconds(10)
                do {
                  if ([IO.File]::ReadAllText($fixture) -ceq $expectedText) { break }
                  Start-Sleep -Milliseconds 250
                } while ([DateTime]::UtcNow -lt $deadline)
                if ([IO.File]::ReadAllText($fixture) -cne $expectedText) {
                  throw 'Owned GUI did not save the exact synthetic edited fixture.'
                }
                Capture 'gui-2-edited-saved.png'
              } elseif ($script:pass -eq 3 -and [IO.File]::ReadAllText($fixture) -cne $expectedText) {
                throw 'Synthetic saved fixture did not persist across a fresh GUI process.'
              }
              $catalogState = Join-Path $profile 'extensions\rp-catalog-state.json'
              $catalogReady = $false
              $deadline = [DateTime]::UtcNow.AddSeconds(30)
              do {
                if ((Read-Log).Contains('invalid persisted RP catalog state')) {
                  throw 'Fresh synthetic profile logged invalid persisted catalog state.'
                }
                if (Test-Path -LiteralPath $catalogState) {
                  $length = (Get-Item -LiteralPath $catalogState).Length
                  if ($length -eq 0) { throw 'Fresh synthetic profile published an empty catalog state.' }
                  $state = Get-Content -LiteralPath $catalogState -Raw | ConvertFrom-Json
                  [uint64]$revision = 0
                  if (-not [uint64]::TryParse([string]$state.revision, [ref]$revision) -or
                      $state.digest -notmatch '^[0-9a-f]{64}$') {
                    throw 'Fresh synthetic catalog state does not contain a valid revision/digest.'
                  }
                  $gui.catalog_snapshots += @{
                    pass = $script:pass; bytes = $length; revision = $revision; digest = $state.digest
                  }
                  $catalogReady = $true
                  break
                }
                Start-Sleep -Milliseconds 250
              } while ([DateTime]::UtcNow -lt $deadline)
              if (-not $catalogReady) { throw 'Fresh synthetic catalog bootstrap did not complete within 30 seconds.' }
              $gui.passes += @{ pass = $script:pass; source = $phaseSource; process_id = $script:process.Id; visible_owned_window = $true; rendered = $true }
              Close-Owned
            }
            if ((Read-Log).Contains('invalid persisted RP catalog state') -or
                (Get-Item -LiteralPath $catalogState).Length -eq 0) {
              throw 'Synthetic catalog state was invalid or empty after both owned processes closed.'
            }
            $closedState = Get-Content -LiteralPath $catalogState -Raw | ConvertFrom-Json
            [uint64]$closedRevision = 0
            if (-not [uint64]::TryParse([string]$closedState.revision, [ref]$closedRevision) -or
                $closedRevision -lt $revision -or $closedState.digest -notmatch '^[0-9a-f]{64}$' -or
                ($closedRevision -eq $revision -and $closedState.digest -cne $state.digest)) {
              throw 'Synthetic catalog state lost its accepted revision/digest after process shutdown.'
            }
            $env:RP_GENERATED_PROFILE = $profile
            @'
          import json, os, pathlib, sqlite3
          root = pathlib.Path(os.environ["RP_GENERATED_PROFILE"])
          proof = []
          for path in (root / "db").rglob("*"):
              if not path.is_file():
                  continue
              with path.open("rb") as source:
                  if source.read(16) != b"SQLite format 3\x00":
                      continue
              connection = sqlite3.connect(path.as_uri() + "?mode=ro", uri=True)
              try:
                  result = connection.execute("PRAGMA quick_check").fetchall()
                  if result != [("ok",)]:
                      raise RuntimeError(f"SQLite integrity failed: {path}: {result}")
                  proof.append({
                      "path": str(path.relative_to(root)),
                      "quick_check": result,
                      "tables": [row[0] for row in connection.execute(
                          "SELECT name FROM sqlite_master WHERE type = ?", ("table",)
                      )],
                  })
              finally:
                  connection.close()
          if not proof:
              raise RuntimeError("No real persistent SQLite databases were generated.")
          pathlib.Path("runtime-evidence/database-integrity.json").write_text(json.dumps(proof, indent=2))
          '@ | python -
            if ($LASTEXITCODE -ne 0) { throw 'Copied-profile databases failed read-only SQLite integrity checks.' }
            $settings = Get-Content "$profile\config\settings.json" -Raw | ConvertFrom-Json
            if ($settings.feature_flags.'acp-beta' -cne 'on' -or
                $settings.feature_flags.'rp-hosted-upgrade-control' -cne 'off') {
              throw 'Existing string ACP override or unrelated flag changed during upgrade.'
            }
            $gui.status = 'passed'
            $gui.saved_fixture_sha256 = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
            $source = Get-Content runtime-evidence/source.json -Raw | ConvertFrom-Json
            $source.gui_runtime_tested = $true
            $source | ConvertTo-Json | Set-Content runtime-evidence/source.json -Encoding utf8NoBOM
          } catch {
            $gui.status = 'failed'
            $gui.error = $_.Exception.Message
            throw
          } finally {
            try { Close-Owned } finally {
              $gui | ConvertTo-Json -Depth 6 | Set-Content runtime-evidence/gui.json -Encoding utf8NoBOM
              [IO.File]::WriteAllText((Join-Path $evidence 'synthetic-zed.log'), (Read-Log))
              if (Test-Path -LiteralPath "$workspace\hosted-fixture.txt") {
                Copy-Item -LiteralPath "$workspace\hosted-fixture.txt" -Destination "$evidence\hosted-fixture.txt"
              }
              $catalogState = Join-Path $profile 'extensions\rp-catalog-state.json'
              if (Test-Path -LiteralPath $catalogState) {
                Get-Item -LiteralPath $catalogState | Select-Object Length |
                  ConvertTo-Json | Set-Content runtime-evidence/catalog-state-file.json -Encoding utf8NoBOM
              }
            }
          }
