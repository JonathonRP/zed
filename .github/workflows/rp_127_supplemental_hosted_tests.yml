name: RP 1.27 supplemental hosted tests
on:
  push:
    branches:
      - validation/rp-127-e27-hosted-tests-20261110
permissions:
  contents: read
env:
  EXPECTED_SOURCE: e27be8d21bbc2c756732280d1730e69039c7fdb3
  EXPECTED_TREE: 7ccb4f7c9236f41cae28c35df4f8b3abf7185a7d
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  focused-tests:
    name: ACP, feature flags, and Settings UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - name: Checkout immutable product candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: JonathonRP/zed
          ref: e27be8d21bbc2c756732280d1730e69039c7fdb3
          fetch-depth: 1
          persist-credentials: false
      - name: Record and guard actual tested source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:EXPECTED_SOURCE) {
            throw 'Test checkout is not the immutable candidate.'
          }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -cne $env:EXPECTED_TREE) {
            throw 'Test checkout tree mismatch.'
          }
          New-Item -ItemType Directory -Path hosted-test-evidence | Out-Null
          [ordered]@{
            source = $source
            tree = $tree
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            workflow_definition_commit = $env:GITHUB_SHA
            supplemental_tests_only = $true
            release_authorization = $false
          } | ConvertTo-Json |
            Set-Content hosted-test-evidence/source.json -Encoding utf8NoBOM
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Required repository Rust toolchain is unavailable.' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Cargo is unavailable.' }
      - name: Install missing documented Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! pkg-config --exists alsa fontconfig glib-2.0 openssl libva wayland-client xkbcommon xkbcommon-x11 libzstd sqlite3 \
            || ! command -v clang >/dev/null \
            || ! command -v cmake >/dev/null \
            || ! command -v ld.lld >/dev/null; then
            script/linux
          fi
          df -h .
          free -h
      - name: Cache Cargo sources only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Run complete relevant suites in standard environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Remove-Item Env:ZED_DISABLE_STAFF -ErrorAction SilentlyContinue
          & cargo test -j 1 -p agent_servers -p feature_flags -p settings_ui --lib --locked -- --test-threads=1 2>&1 |
            Tee-Object -FilePath hosted-test-evidence/full-suites.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Complete relevant test suites failed with exit $exitCode." }
          $results = Select-String -Path hosted-test-evidence/full-suites.log -Pattern 'test result: ok\. ([1-9][0-9]*) passed; 0 failed'
          if (@($results).Count -ne 3) { throw 'Expected three genuinely executed nonempty test suites.' }
          if (git status --porcelain --untracked-files=no) { throw 'Tests modified tracked candidate files.' }
      - name: Run nonstaff ACP, native MCP, fallback, and new UI assertions
        shell: pwsh
        env:
          ZED_DISABLE_STAFF: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & cargo test -j 1 -p agent_servers -p feature_flags -p settings_ui --lib --locked -- acp_beta native_mcp v2_request_ids selection_tests --test-threads=1 2>&1 |
            Tee-Object -FilePath hosted-test-evidence/nonstaff-focused.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Nonstaff focused test suites failed with exit $exitCode." }
          $log = Get-Content hosted-test-evidence/nonstaff-focused.log -Raw
          foreach ($name in @(
            'acp_beta_experimental_setting_is_searchable_and_user_scoped',
            'acp_beta_persists_override_and_reset_restores_rollout',
            'acp_beta_creates_existing_string_setting_without_other_flags'
          )) {
            if ($log -notmatch ([Regex]::Escape($name) + ' .*ok')) {
              throw "Required UI assertion did not pass: $name"
            }
          }
          if ($log -notmatch 'selection_tests::.* \.\.\. ok') {
            throw 'The platform-specific ACP selection and fallback tests did not execute.'
          }
          if (@([Regex]::Matches($log, 'test result: ok\. [1-9][0-9]* passed; 0 failed')).Count -ne 3) {
            throw 'Expected three nonempty nonstaff focused suites.'
          }
          if (git status --porcelain --untracked-files=no) { throw 'Tests modified tracked candidate files.' }
      - name: Preserve source-bound test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp-127-supplemental-tests-${{ matrix.os }}-e27be8d21bbc2c756732280d1730e69039c7fdb3
          path: hosted-test-evidence/
          if-no-files-found: error
          retention-days: 7
