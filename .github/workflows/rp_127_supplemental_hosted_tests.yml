name: RP 1.27 supplemental hosted tests
on:
  push:
    branches:
      - validation/rp-127-e27-hosted-tests-20261110
permissions:
  contents: read
env:
  EXPECTED_SOURCE: 2d339cac9a9ffa47e1621aab8602b1870b95c5d1
  EXPECTED_TREE: a8deac590f9678cf9d56230b9d844bd3b55006d8
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  focused-tests:
    name: Atomic FS, catalog, ACP, flags, and Settings UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - name: Checkout immutable product candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: JonathonRP/zed
          ref: ${{ env.EXPECTED_SOURCE }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record and guard actual tested source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:EXPECTED_SOURCE) {
            throw 'Test checkout is not the immutable candidate.'
          }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -cne $env:EXPECTED_TREE) {
            throw 'Test checkout tree mismatch.'
          }
          New-Item -ItemType Directory -Path hosted-test-evidence | Out-Null
          [ordered]@{
            source = $source
            tree = $tree
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            workflow_definition_commit = $env:GITHUB_SHA
            supplemental_tests_only = $true
            release_authorization = $false
          } | ConvertTo-Json |
            Set-Content hosted-test-evidence/source.json -Encoding utf8NoBOM
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Required repository Rust toolchain is unavailable.' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Cargo is unavailable.' }
      - name: Check formatting of corrected source files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & rustfmt --check --edition 2024 --config skip_children=true crates/fs/src/fs.rs crates/extension_host/src/extension_host.rs
          if ($LASTEXITCODE -ne 0) { throw 'Corrected source formatting failed.' }
      - name: Install missing documented Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! pkg-config --exists alsa fontconfig glib-2.0 openssl libva wayland-client xkbcommon xkbcommon-x11 libzstd sqlite3 \
            || ! command -v clang >/dev/null \
            || ! command -v cmake >/dev/null \
            || ! command -v ld.lld >/dev/null; then
            script/linux
          fi
          df -h .
          free -h
      - name: Select supported Linux C++ compiler and linker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v clang-18
          command -v clang++-18
          command -v ld.lld
          clang++-18 --version
          printf '%s\n' 'CC=clang-18' 'CXX=clang++-18' \
            'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang-18' \
            'RUSTFLAGS=-C symbol-mangling-version=v0 --cfg tokio_unstable -C link-arg=-fuse-ld=lld' \
            >> "$GITHUB_ENV"
      - name: Cache Cargo sources only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Run complete ACP, flag, and UI suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Remove-Item Env:ZED_DISABLE_STAFF -ErrorAction SilentlyContinue
          & cargo test -j 1 -p agent_servers -p feature_flags -p settings_ui --lib --locked -- --test-threads=1 2>&1 |
            Tee-Object -FilePath hosted-test-evidence/full-suites.log
          if ($LASTEXITCODE -ne 0) { throw "Complete relevant suites failed: $LASTEXITCODE" }
          $results = Select-String hosted-test-evidence/full-suites.log -Pattern 'test result: ok\. ([1-9][0-9]*) passed; 0 failed'
          if (@($results).Count -ne 3) { throw 'Expected three genuinely executed nonempty complete suites.' }
          if (git status --porcelain --untracked-files=no) { throw 'Tests modified tracked source.' }
      - name: Execute deterministic Windows atomic-replacement regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & cargo test -j 1 --locked -p fs --lib atomic_replace_tests -- --nocapture --test-threads=1 2>&1 |
            Tee-Object -FilePath hosted-test-evidence/windows-atomic-replacement.log
          if ($LASTEXITCODE -ne 0) { throw "Windows replacement regressions failed: $LASTEXITCODE" }
          $log = Get-Content hosted-test-evidence/windows-atomic-replacement.log -Raw
          foreach ($name in @(
            'missing_replacement_does_not_create_empty_destination',
            'locked_replacement_does_not_publish_empty_state_and_can_retry',
            'failed_replacement_preserves_existing_catalog_state',
            'concurrent_create_retries_replace_and_preserves_winner_on_failure'
          )) {
            if ($log -notmatch ([Regex]::Escape($name) + ' .*ok')) { throw "Windows replacement assertion missing: $name" }
          }
          if ($log -notmatch 'test result: ok\. 4 passed; 0 failed; 0 ignored') {
            throw 'Expected all four genuinely executed Windows replacement regressions.'
          }
      - name: Execute real-filesystem atomic-write integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & cargo test -j 1 --locked -p fs --features test-support --test integration test_realfs_atomic_write -- --nocapture --test-threads=1 2>&1 |
            Tee-Object -FilePath hosted-test-evidence/realfs-atomic-write.log
          if ($LASTEXITCODE -ne 0) { throw "Real filesystem integration failed: $LASTEXITCODE" }
          $log = Get-Content hosted-test-evidence/realfs-atomic-write.log -Raw
          if ($log -notmatch 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored') {
            throw 'Real filesystem atomic-write integration did not genuinely execute.'
          }
      - name: Execute catalog rollback and conflict guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & cargo test -j 1 --locked -p extension_host --lib rp_extension_catalog -- --nocapture --test-threads=1 2>&1 |
            Tee-Object -FilePath hosted-test-evidence/catalog-guards.log
          if ($LASTEXITCODE -ne 0) { throw "Catalog guards failed: $LASTEXITCODE" }
          $log = Get-Content hosted-test-evidence/catalog-guards.log -Raw
          foreach ($name in @(
            'dynamic_revision_rejects_rollback_and_equal_conflict',
            'catalog_integrity_correspondence_is_fail_closed',
            'digest_first_refresh_reuses_snapshot_and_accepts_changed_digest',
            'update_selection_only_advances_semver_within_authority'
          )) {
            if ($log -notmatch ([Regex]::Escape($name) + ' .*ok')) { throw "Catalog guard missing: $name" }
          }
          foreach ($name in @(
            'validates_live_catalog_fixture_without_pinning_snapshot_identity',
            'validates_and_stages_live_rp_archive_in_isolation'
          )) {
            if ($log -notmatch ([Regex]::Escape($name) + ' .*ignored')) { throw "External fixture skip not accounted for: $name" }
          }
          if ($log -notmatch 'test result: ok\. [1-9][0-9]* passed; 0 failed; 2 ignored') {
            throw 'Catalog guards did not execute with exactly the two existing external-fixture ignores.'
          }
      - name: Execute nonstaff ACP, native MCP, fallback, and new UI assertions
        shell: pwsh
        env:
          ZED_DISABLE_STAFF: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & cargo test -j 1 -p agent_servers -p feature_flags -p settings_ui --lib --locked -- acp_beta native_mcp v2_request_ids selection_tests --test-threads=1 2>&1 |
            Tee-Object -FilePath hosted-test-evidence/nonstaff-focused.log
          if ($LASTEXITCODE -ne 0) { throw "Nonstaff suites failed: $LASTEXITCODE" }
          $log = Get-Content hosted-test-evidence/nonstaff-focused.log -Raw
          foreach ($name in @(
            'acp_beta_experimental_setting_is_searchable_and_user_scoped',
            'acp_beta_persists_override_and_reset_restores_rollout',
            'acp_beta_creates_existing_string_setting_without_other_flags'
          )) {
            if ($log -notmatch ([Regex]::Escape($name) + ' .*ok')) { throw "UI assertion missing: $name" }
          }
          if ($log -notmatch 'selection_tests::.* \.\.\. ok') { throw 'Platform fallback/selection tests did not execute.' }
          if (@([Regex]::Matches($log, 'test result: ok\. [1-9][0-9]* passed; 0 failed')).Count -ne 3) {
            throw 'Expected three nonempty nonstaff suites.'
          }
          if (git status --porcelain --untracked-files=no) { throw 'Tests modified tracked source.' }
      - name: Set up required Node runtime for pinned adapter
        if: runner.os == 'Linux'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Build only the existing ACP smoke test executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -j 1 -p agent_servers --lib --locked --no-run --message-format=json \
            > hosted-test-evidence/compiler-artifacts.jsonl \
            2> >(tee hosted-test-evidence/compile.log >&2)
          python3 - <<'PY'
          import json, pathlib
          messages = [json.loads(line) for line in pathlib.Path("hosted-test-evidence/compiler-artifacts.jsonl").read_text().splitlines()]
          binaries = [m["executable"] for m in messages if m.get("reason") == "compiler-artifact" and m.get("target", {}).get("name") == "agent_servers" and m.get("profile", {}).get("test") and m.get("executable")]
          if len(binaries) != 1:
              raise RuntimeError(f"Expected one ACP test executable, found {binaries!r}")
          pathlib.Path("hosted-test-evidence/test-executable.txt").write_text(binaries[0] + "\n")
          PY
      - name: Prewarm exact anonymous adapter package outside handshake timeouts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$RUNNER_TEMP/rp-adapter-smoke-home"
          isolated_tmp="$RUNNER_TEMP/rp-adapter-smoke-tmp"
          mkdir "$isolated_home" "$isolated_tmp"
          timeout --signal=TERM --kill-after=15s 300s env -i \
            HOME="$isolated_home" TMPDIR="$isolated_tmp" PATH="$PATH" \
            npx --yes @agentclientprotocol/claude-agent-acp@0.94.0 --version \
            2>&1 | tee hosted-test-evidence/pinned-adapter-version.log
          grep -Fx '0.94.0' hosted-test-evidence/pinned-adapter-version.log
      - name: Run exact pinned adapter smoke without inherited credentials
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$RUNNER_TEMP/rp-adapter-smoke-home"
          isolated_tmp="$RUNNER_TEMP/rp-adapter-smoke-tmp"
          test -d "$isolated_home"
          test -d "$isolated_tmp"
          binary="$(cat hosted-test-evidence/test-executable.txt)"
          test -x "$binary"
          timeout --signal=TERM --kill-after=15s 180s env -i \
            HOME="$isolated_home" TMPDIR="$isolated_tmp" PATH="$PATH" \
            ZED_HEADLESS=1 ZED_DISABLE_STAFF=1 SEED=0 ITERATIONS=1 \
            "$binary" acp::selection_tests::claude_adapter_initialize_smoke \
            --ignored --exact --nocapture --test-threads=1 \
            2>&1 | tee hosted-test-evidence/real-adapter-smoke.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored' \
            hosted-test-evidence/real-adapter-smoke.log
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Preserve source-bound test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp-127-supplemental-tests-${{ matrix.os }}-${{ env.EXPECTED_SOURCE }}
          path: hosted-test-evidence/
          if-no-files-found: error
          retention-days: 7
