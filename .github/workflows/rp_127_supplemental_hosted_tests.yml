name: RP 1.27 delivered-binary hosted smoke
on:
  push:
    branches:
      - validation/rp-127-e27-hosted-tests-20261110
permissions:
  contents: read
  actions: read
env:
  EXPECTED_SOURCE: 2d339cac9a9ffa47e1621aab8602b1870b95c5d1
jobs:
  linux-prebuilt:
    name: Prebuilt Linux remote-server startup
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download exact canonical Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: JonathonRP/zed
          run-id: 42910418431
          github-token: ${{ github.token }}
          name: rp-profile-compatibility-linux-x86_64-2d339cac9a9ffa47e1621aab8602b1870b95c5d1
          path: canonical-linux
      - name: Verify and execute only source-matched server version
        shell: bash
        run: |
          set -euo pipefail
          mkdir runtime-evidence
          python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib, shutil
          manifest = json.loads(pathlib.Path("canonical-linux/linux-source-identity.json").read_text())
          assert manifest["commit"] == os.environ["EXPECTED_SOURCE"]
          assert manifest["upstream_tag_commit"] == "c84af5b99cbc366d675064e52b23664a015b6e35"
          compressed = pathlib.Path("canonical-linux") / manifest["asset_names"]["linux_x86_64_remote_server"]
          assert hashlib.sha256(compressed.read_bytes()).hexdigest() == "12914848c91aff46532d233ada318b85315795c81f6909d8aba604201c082513"
          executable = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rp127-remote-server"
          with gzip.open(compressed, "rb") as source, executable.open("xb") as destination:
              shutil.copyfileobj(source, destination)
          digest_state = hashlib.sha256()
          with executable.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest_state.update(chunk)
          digest = digest_state.hexdigest()
          assert digest == "59c81b0d93385f1709e101ad3c69685332398597db1b0442fb3da7da0112f0ae"
          executable.chmod(0o700)
          pathlib.Path("runtime-evidence/source.json").write_text(json.dumps({
              "source": manifest["commit"], "run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_definition_commit": os.environ["GITHUB_SHA"],
              "canonical_run": 42910418431, "elf_sha256": digest,
              "synthetic_hosted_runtime_only": True, "owner_acceptance": False,
          }, indent=2))
          PY
          isolated_home="$RUNNER_TEMP/rp127-remote-home"
          mkdir "$isolated_home"
          timeout --signal=TERM --kill-after=5s 20s env -i \
            HOME="$isolated_home" PATH="$PATH" \
            "$RUNNER_TEMP/rp127-remote-server" version \
            2>&1 | tee runtime-evidence/remote-version.log
          grep -Fx '1.27.0' runtime-evidence/remote-version.log
      - name: Preserve source-bound Linux runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp-127-prebuilt-linux-runtime-2d339cac9a9ffa47e1621aab8602b1870b95c5d1
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 7
