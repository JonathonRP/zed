name: RP 1.27 supplemental hosted runtime
on:
  push:
    branches:
      - validation/rp-127-e27-hosted-tests-20261110
permissions:
  contents: read
  actions: read
env:
  EXPECTED_SOURCE: e27be8d21bbc2c756732280d1730e69039c7fdb3
jobs:
  windows-prebuilt:
    name: Delivered Windows binary metadata and version
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Download exact canonical Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40a5b8a24b5f5461e7c
        with:
          repository: JonathonRP/zed
          run-id: 42872582412
          github-token: ${{ github.token }}
          name: rp-profile-compatibility-windows-x86_64-e27be8d21bbc2c756732280d1730e69039c7fdb3
          path: canonical-windows
      - name: Download exact canonical metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40a5b8a24b5f5461e7c
        with:
          repository: JonathonRP/zed
          run-id: 42872582412
          github-token: ${{ github.token }}
          name: rp-profile-compatibility-metadata-e27be8d21bbc2c756732280d1730e69039c7fdb3
          path: canonical-metadata
      - name: Run bounded delivered-binary metadata diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path runtime-evidence | Out-Null
          $manifest = Get-Content canonical-metadata/rp-release-manifest.json -Raw | ConvertFrom-Json
          $packaged = Get-Content canonical-windows/windows-source-identity.json -Raw | ConvertFrom-Json
          if ($manifest.commit -cne $env:EXPECTED_SOURCE -or $packaged.commit -cne $env:EXPECTED_SOURCE) {
            throw 'Delivered artifact source mismatch.'
          }
          $portable = Join-Path (Resolve-Path canonical-windows) $manifest.asset_names.windows_x86_64_portable
          if ((Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              '3d03c4a07b120e411caed39eb524c82fca53e30c21cad79d6f8f6aeac26fa686') {
            throw 'Portable archive digest mismatch.'
          }
          $product = Join-Path $env:RUNNER_TEMP 'rp127-delivered-portable'
          Expand-Archive -LiteralPath $portable -DestinationPath $product
          $exe = Join-Path $product 'Zed.exe'
          $digest = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne '5537a7805a6cbcfa0c3941f73597c5dbe2098b2d0fd6187ea38260d802982065') {
            throw 'Delivered RP executable digest mismatch.'
          }
          $metadata = (Resolve-Path canonical-metadata).Path
          $process = Start-Process -FilePath $exe -ArgumentList @(
            '--verify-rp-release-metadata', ('"' + $metadata + '"')
          ) -PassThru -RedirectStandardOutput runtime-evidence/metadata.stdout.log `
            -RedirectStandardError runtime-evidence/metadata.stderr.log
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id
            throw 'Delivered metadata diagnostic exceeded its 60-second bound.'
          }
          if ($process.ExitCode -ne 0) { throw "Delivered metadata diagnostic exited $($process.ExitCode)." }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          if (-not $version.StartsWith('1.27.0+stable.') -or -not $version.EndsWith($env:EXPECTED_SOURCE)) {
            throw "Delivered product version does not bind source: $version"
          }
          [ordered]@{
            source = $env:EXPECTED_SOURCE
            run_id = $env:GITHUB_RUN_ID
            canonical_run = 42872582412
            rp_executable_sha256 = $digest
            product_version = $version
            metadata_diagnostic_exit_code = $process.ExitCode
            gui_runtime_tested = $false
            private_profile_tested = $false
            wsl_runtime_tested = $false
            owner_acceptance = $false
          } | ConvertTo-Json | Set-Content runtime-evidence/source.json -Encoding utf8NoBOM
      - name: Preserve source-bound Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp-127-prebuilt-windows-runtime-e27be8d21bbc2c756732280d1730e69039c7fdb3
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 7
  linux-prebuilt:
    name: Prebuilt Linux remote-server startup
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download exact canonical Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40a5b8a24b5f5461e7c
        with:
          repository: JonathonRP/zed
          run-id: 42872582412
          github-token: ${{ github.token }}
          name: rp-profile-compatibility-linux-x86_64-e27be8d21bbc2c756732280d1730e69039c7fdb3
          path: canonical-linux
      - name: Verify and execute only source-matched server version
        shell: bash
        run: |
          set -euo pipefail
          mkdir runtime-evidence
          python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib, shutil
          manifest = json.loads(pathlib.Path("canonical-linux/linux-source-identity.json").read_text())
          assert manifest["commit"] == os.environ["EXPECTED_SOURCE"]
          assert manifest["upstream_tag_commit"] == "c84af5b99cbc366d675064e52b23664a015b6e35"
          compressed = pathlib.Path("canonical-linux") / manifest["asset_names"]["linux_x86_64_remote_server"]
          assert hashlib.sha256(compressed.read_bytes()).hexdigest() == "8a0a01af2a3c2805b32871fc1a87272ebd38d2d9eb992a8f4a35efa113ff37fd"
          executable = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rp127-remote-server"
          with gzip.open(compressed, "rb") as source, executable.open("xb") as destination:
              shutil.copyfileobj(source, destination)
          digest_state = hashlib.sha256()
          with executable.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest_state.update(chunk)
          digest = digest_state.hexdigest()
          assert digest == "6a3e28128d8cb35b1278821cd8d1459b50afd08e776a248db7ce0d441d17a8e2"
          executable.chmod(0o700)
          pathlib.Path("runtime-evidence/source.json").write_text(json.dumps({
              "source": manifest["commit"], "run_id": os.environ["GITHUB_RUN_ID"],
              "canonical_run": 42872582412, "elf_sha256": digest,
              "synthetic_hosted_runtime_only": True, "owner_acceptance": False,
          }, indent=2))
          PY
          isolated_home="$RUNNER_TEMP/rp127-remote-home"
          mkdir "$isolated_home"
          timeout --signal=TERM --kill-after=5s 20s env -i \
            HOME="$isolated_home" PATH="$PATH" \
            "$RUNNER_TEMP/rp127-remote-server" version \
            2>&1 | tee runtime-evidence/remote-version.log
          grep -Fx '1.27.0' runtime-evidence/remote-version.log
      - name: Preserve source-bound Linux runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp-127-prebuilt-linux-runtime-e27be8d21bbc2c756732280d1730e69039c7fdb3
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 7
